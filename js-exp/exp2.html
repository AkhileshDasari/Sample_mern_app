<html>
    <body>
        <h1>Function in js</h1>
        <script>
            const pi=3.14;
            //function definition
            function area_of_circle(r){
                return pi*r*r;
            }
            //function call
            console.log(area_of_circle(5));
            //arrow function
            let area_of_cylinder=(r,h)=>{return pi*r*r*h};
            console.log(area_of_cylinder(5,3));

        </script>
    </body>
</html>
